services:
  - type: web
    name: nearena-socket
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set to your Vercel URL after the frontend is deployed, e.g. https://nearena.vercel.app
      - key: SOCKET_CORS_ORIGIN
        sync: false
